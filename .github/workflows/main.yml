name: Build ZEE WEATHER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          test -f zee-weather.zip || exit 1
          mkdir -p project
          unzip -q zee-weather.zip -d project

      - name: Locate Project
        run: |
          PROJECT_FILE=$(find project -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Check Capacitor
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "Capacitor configuration is missing"
            exit 1
          fi

          if [ ! -d node_modules/@capacitor/core ]; then
            echo "Capacitor core is missing"
            exit 1
          fi

      - name: Generate Fresh Android Project
        run: |
          cd "$PROJECT_DIR"

          CAP_MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")

          npm install "@capacitor/android@^${CAP_MAJOR}" --legacy-peer-deps

          rm -rf android

          npx cap add android

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEE-WEATHER-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
