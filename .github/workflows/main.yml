name: Build ZEE WEATHER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: |
          echo "Checking Android SDK..."
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found"
            exit 1
          fi
          ls "$ANDROID_HOME"
          echo "Android SDK path verified"

      - name: Extract Project ZIP
        run: |
          if [ ! -f "zee-weather.zip" ]; then
            echo "zee-weather.zip not found"
            exit 1
          fi

          mkdir -p project
          unzip -q zee-weather.zip -d project

      - name: Locate Project
        run: |
          PROJECT_FILE=$(find project -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Sync Android Project
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEE-WEATHER-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
